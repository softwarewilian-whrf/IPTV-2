<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebTv Player - IPTV Blink Clone</title>
    <!-- React & Tailwind CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HLS.js for IPTV Video Streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1e293b;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 3px;
        }
    </style>
</head>
<body class="h-screen overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            // Login States
            const [loginType, setLoginType] = useState('xtream'); // 'xtream' | 'm3u'
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            
            // Form Data
            const [serverUrl, setServerUrl] = useState('');
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [m3uUrl, setM3uUrl] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            // App Data
            const [channels, setChannels] = useState([]);
            const [categories, setCategories] = useState([]);
            const [selectedCategory, setSelectedCategory] = useState('ALL');
            const [selectedChannel, setSelectedChannel] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');

            // Ref for Video Player
            const videoRef = useRef(null);
            const hlsRef = useRef(null);

            // Handle Xtream API Login
            const handleXtreamLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');

                try {
                    const cleanUrl = serverUrl.replace(/\/$/, "");
                    const authUrl = `${cleanUrl}/player_api.php?username=${username}&password=${password}`;
                    
                    const res = await fetch(authUrl);
                    const data = await res.json();

                    if (data.user_info && data.user_info.auth === 1) {
                        // Fetch Live Streams
                        const streamsRes = await fetch(`${cleanUrl}/player_api.php?username=${username}&password=${password}&action=get_live_streams`);
                        const streamsData = await streamsRes.json();
                        
                        // Fetch Categories
                        const catsRes = await fetch(`${cleanUrl}/player_api.php?username=${username}&password=${password}&action=get_live_categories`);
                        const catsData = await catsRes.json();

                        const formattedChannels = streamsData.map(ch => ({
                            id: ch.stream_id,
                            name: ch.name,
                            logo: ch.stream_icon,
                            categoryId: ch.category_id,
                            url: `${cleanUrl}/live/${username}/${password}/${ch.stream_id}.m3u8`
                        }));

                        setChannels(formattedChannels);
                        setCategories(catsData || []);
                        setIsAuthenticated(true);
                        if (formattedChannels.length > 0) {
                            setSelectedChannel(formattedChannels[0]);
                        }
                    } else {
                        setError('Usuário ou senha inválidos.');
                    }
                } catch (err) {
                    setError('Falha na conexão com o servidor. Verifique a URL e CORS.');
                } finally {
                    setLoading(false);
                }
            };

            // Handle M3U Login / Parsing
            const handleM3uLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');

                try {
                    const res = await fetch(m3uUrl);
                    const text = await res.text();
                    
                    // Simple M3U Parser
                    const lines = text.split('\n');
                    const parsedChannels = [];
                    let currentChannel = {};

                    lines.forEach((line) => {
                        line = line.trim();
                        if (line.startsWith('#EXTINF:')) {
                            const nameMatch = line.match(/,(.+)$/);
                            const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                            const groupMatch = line.match(/group-title="([^"]+)"/);

                            currentChannel = {
                                id: Math.random().toString(36).substr(2, 9),
                                name: nameMatch ? nameMatch[1] : 'Canal Sem Nome',
                                logo: logoMatch ? logoMatch[1] : '',
                                categoryId: groupMatch ? groupMatch[1] : 'Geral'
                            };
                        } else if (line.startsWith('http')) {
                            currentChannel.url = line;
                            parsedChannels.push(currentChannel);
                            currentChannel = {};
                        }
                    });

                    if (parsedChannels.length > 0) {
                        setChannels(parsedChannels);
                        setIsAuthenticated(true);
                        setSelectedChannel(parsedChannels[0]);
                    } else {
                        setError('Nenhum canal encontrado na lista M3U.');
                    }
                } catch (err) {
                    setError('Erro ao carregar lista M3U. Verifique o link e permissões CORS.');
                } finally {
                    setLoading(false);
                }
            };

            // HLS Stream Setup on Channel Select
            useEffect(() => {
                if (selectedChannel && videoRef.current) {
                    const video = videoRef.current;
                    const streamUrl = selectedChannel.url;

                    if (hlsRef.current) {
                        hlsRef.current.destroy();
                    }

                    if (Hls.isSupported()) {
                        const hls = new Hls();
                        hls.loadSource(streamUrl);
                        hls.attachMedia(video);
                        hls.on(Hls.Events.MANIFEST_PARSED, () => {
                            video.play().catch(() => {});
                        });
                        hlsRef.current = hls;
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = streamUrl;
                        video.addEventListener('loadedmetadata', () => {
                            video.play().catch(() => {});
                        });
                    }
                }
            }, [selectedChannel]);

            // Filter Channels
            const filteredChannels = channels.filter(ch => {
                const matchesCategory = selectedCategory === 'ALL' || ch.categoryId === selectedCategory;
                const matchesSearch = ch.name.toLowerCase().includes(searchTerm.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-950 p-4">
                        <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
                            <div className="text-center mb-8">
                                <div className="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl mb-4 shadow-lg shadow-blue-500/30">
                                    <span className="text-2xl font-bold text-white">BLINK</span>
                                </div>
                                <h1 className="text-2xl font-bold text-white">WebTV Player</h1>
                                <p className="text-slate-400 text-sm mt-1">Conecte-se à sua playlist IPTV</p>
                            </div>

                            {/* Login Type Tabs */}
                            <div className="flex bg-slate-800 p-1 rounded-xl mb-6">
                                <button
                                    onClick={() => setLoginType('xtream')}
                                    className={`flex-1 py-2 text-sm font-medium rounded-lg transition-all ${
                                        loginType === 'xtream' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'
                                    }`}
                                >
                                    Xtream Codes API
                                </button>
                                <button
                                    onClick={() => setLoginType('m3u')}
                                    className={`flex-1 py-2 text-sm font-medium rounded-lg transition-all ${
                                        loginType === 'm3u' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'
                                    }`}
                                >
                                    Lista M3U URL
                                </button>
                            </div>

                            {error && (
                                <div className="mb-4 p-3 bg-red-500/10 border border-red-500/20 text-red-400 text-xs rounded-lg text-center">
                                    {error}
                                </div>
                            )}

                            {loginType === 'xtream' ? (
                                <form onSubmit={handleXtreamLogin} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">URL do Servidor</label>
                                        <input
                                            type="url"
                                            placeholder="http://seu-provedor.com:8080"
                                            value={serverUrl}
                                            onChange={(e) => setServerUrl(e.target.value)}
                                            required
                                            className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Usuário</label>
                                        <input
                                            type="text"
                                            placeholder="Usuário"
                                            value={username}
                                            onChange={(e) => setUsername(e.target.value)}
                                            required
                                            className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Senha</label>
                                        <input
                                            type="password"
                                            placeholder="Senha"
                                            value={password}
                                            onChange={(e) => setPassword(e.target.value)}
                                            required
                                            className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors"
                                        />
                                    </div>
                                    <button
                                        type="submit"
                                        disabled={loading}
                                        className="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl shadow-lg shadow-blue-500/25 transition-all disabled:opacity-50"
                                    >
                                        {loading ? 'Carregando...' : 'Entrar'}
                                    </button>
                                </form>
                            ) : (
                                <form onSubmit={handleM3uLogin} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">URL da Lista M3U</label>
                                        <input
                                            type="url"
                                            placeholder="https://exemplo.com/lista.m3u"
                                            value={m3uUrl}
                                            onChange={(e) => setM3uUrl(e.target.value)}
                                            required
                                            className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors"
                                        />
                                    </div>
                                    <button
                                        type="submit"
                                        disabled={loading}
                                        className="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl shadow-lg shadow-blue-500/25 transition-all disabled:opacity-50"
                                    >
                                        {loading ? 'Carregando...' : 'Carregar Playlist'}
                                    </button>
                                </form>
                            )}

                            <div className="mt-8 text-center border-t border-slate-800 pt-4">
                                <p className="text-xs text-slate-500">Desenvolvido com JS / React Client-Side</p>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen bg-slate-950 text-slate-100">
                    {/* Left Sidebar: Categories & Search */}
                    <div className="w-80 bg-slate-900 border-r border-slate-800 flex flex-col">
                        <div className="p-4 border-b border-slate-800 flex items-center justify-between">
                            <div className="flex items-center space-x-2">
                                <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-white text-xs">
                                    BLINK
                                </div>
                                <span className="font-bold text-lg">WebTV</span>
                            </div>
                            <button 
                                onClick={() => setIsAuthenticated(false)}
                                className="text-xs text-slate-400 hover:text-red-400 transition-colors"
                            >
                                Sair
                            </button>
                        </div>

                        {/* Search Bar */}
                        <div className="p-4">
                            <input
                                type="text"
                                placeholder="Buscar canal..."
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                                className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500"
                            />
                        </div>

                        {/* Categories List */}
                        {categories.length > 0 && (
                            <div className="px-4 pb-2">
                                <select 
                                    value={selectedCategory} 
                                    onChange={(e) => setSelectedCategory(e.target.value)}
                                    className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none"
                                >
                                    <option value="ALL">Todas as Categorias</option>
                                    {categories.map(cat => (
                                        <option key={cat.category_id} value={cat.category_id}>
                                            {cat.category_name}
                                        </option>
                                    ))}
                                </select>
                            </div>
                        )}

                        {/* Channels List */}
                        <div className="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-1">
                            {filteredChannels.map((channel) => (
                                <button
                                    key={channel.id}
                                    onClick={() => setSelectedChannel(channel)}
                                    className={`w-full flex items-center space-x-3 p-2 rounded-lg transition-all text-left ${
                                        selectedChannel?.id === channel.id
                                            ? 'bg-blue-600/20 border border-blue-500/50 text-white'
                                            : 'hover:bg-slate-800/60 text-slate-300'
                                    }`}
                                >
                                    {channel.logo ? (
                                        <img 
                                            src={channel.logo} 
                                            alt="" 
                                            className="w-10 h-10 object-contain rounded bg-slate-950 p-1"
                                            onError={(e) => { e.target.style.display = 'none'; }} 
                                        />
                                    ) : (
                                        <div className="w-10 h-10 bg-slate-800 rounded flex items-center justify-center text-xs font-bold text-slate-500">
                                            TV
                                        </div>
                                    )}
                                    <span className="text-sm font-medium truncate flex-1">{channel.name}</span>
                                </button>
                            ))}

                            {filteredChannels.length === 0 && (
                                <div className="text-center text-slate-500 text-sm py-8">
                                    Nenhum canal encontrado
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Main Content Area: Video Player & Controls */}
                    <div className="flex-1 flex flex-col bg-slate-950">
                        {/* Video Player */}
                        <div className="flex-1 bg-black relative flex items-center justify-center">
                            {selectedChannel ? (
                                <video
                                    ref={videoRef}
                                    controls
                                    className="w-full h-full max-h-screen object-contain"
                                    autoPlay
                                ></video>
                            ) : (
                                <div className="text-slate-500 text-center">
                                    <p className="text-lg">Selecione um canal para assistir</p>
                                </div>
                            )}
                        </div>

                        {/* Channel Header Bar */}
                        {selectedChannel && (
                            <div className="bg-slate-900 border-t border-slate-800 p-4 flex items-center justify-between">
                                <div className="flex items-center space-x-4">
                                    {selectedChannel.logo && (
                                        <img src={selectedChannel.logo} className="w-12 h-12 object-contain bg-slate-950 p-1 rounded" />
                                    )}
                                    <div>
                                        <h2 className="text-lg font-bold text-white">{selectedChannel.name}</h2>
                                        <p className="text-xs text-slate-400">Ao Vivo • HLS Stream</p>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
